<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Light background for the page */
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative; /* For positioning charles-background-tag */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .charles-background-tag {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15vw; /* Large font size responsive to viewport width */
            font-weight: bold;
            color: rgba(0, 0, 0, 0.05); /* Very subtle and semi-transparent */
            z-index: -1; /* Behind the chessboard */
            pointer-events: none; /* Make it non-interactive */
            user-select: none; /* Prevent text selection */
        }
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            width: 480px; /* 8 * 60px */
            height: 480px; /* 8 * 60px */
            border: 3px solid #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px; /* Size for Unicode pieces */
            box-sizing: border-box;
            line-height: 60px; /* Vertically center text fallback */
            text-align: center; /* Horizontally center text fallback */
        }
        .light-square {
            background-color: #f0d9b5; /* Light beige */
        }
        .dark-square {
            background-color: #b58863; /* Medium brown */
        }
        .selected {
            background-color: #ffeb3b !important; /* Yellow highlight, !important to override light/dark */
            border: 2px dashed #333; /* Dashed border for selected */
        }
        #game-status {
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="charles-background-tag">CHARLES</div>
        <div class="chessboard" id="chessboard">
            <!-- Chessboard squares will be generated by JavaScript -->
        </div>
        <div id="game-status">Game Status: Ready</div>
    </div>

    <script>
        let selectedSquare = null;
        // boardState will store the logical state (piece symbols like 'R', 'p', or empty string)
        // It's initialized from startingPosition in setupChessboard.
        let boardState = [];

        const piecesUnicode = {
            'R': '&#9814;', 'N': '&#9816;', 'B': '&#9815;', 'Q': '&#9813;', 'K': '&#9812;', 'P': '&#9817;', // White
            'r': '&#9820;', 'n': '&#9822;', 'b': '&#9821;', 'q': '&#9819;', 'k': '&#9818;', 'p': '&#9823;'  // Black
        };

        // Initial board setup (piece symbols)
        const startingPosition = [
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R'], // White back rank (row 0)
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // White pawns (row 1)
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Black pawns (row 6)
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // Black back rank (row 7)
        ];

        function setupChessboard() {
            const chessboardElement = document.getElementById('chessboard');
            if (!chessboardElement) {
                console.error("Error: Chessboard element not found in HTML.");
                return;
            }
            chessboardElement.innerHTML = ''; // Clear previous board
            boardState = JSON.parse(JSON.stringify(startingPosition)); // Deep copy for boardState

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const squareDiv = document.createElement('div');
                    squareDiv.classList.add('square');
                    squareDiv.dataset.row = row;
                    squareDiv.dataset.col = col;
                    squareDiv.id = `sq-${row}-${col}`;

                    if ((row + col) % 2 === 0) {
                        squareDiv.classList.add('light-square');
                    } else {
                        squareDiv.classList.add('dark-square');
                    }

                    const pieceSymbol = boardState[row][col];
                    if (pieceSymbol && piecesUnicode[pieceSymbol]) {
                        squareDiv.innerHTML = piecesUnicode[pieceSymbol];
                    }

                    squareDiv.addEventListener('click', handleSquareClick);
                    chessboardElement.appendChild(squareDiv);
                }
            }
            console.log("Chessboard with event listeners generated.");
        }

        function handleSquareClick(event) {
            const clickedSquare = event.currentTarget;
            const clickedRow = parseInt(clickedSquare.dataset.row);
            const clickedCol = parseInt(clickedSquare.dataset.col);

            if (selectedSquare) {
                // A square is already selected
                if (selectedSquare === clickedSquare) {
                    // Clicked the same square: deselect
                    selectedSquare.classList.remove('selected');
                    selectedSquare = null;
                } else {
                    // Clicked a different square: attempt to move
                    if (isValidMove(selectedSquare, clickedSquare)) {
                        const prevRow = parseInt(selectedSquare.dataset.row);
                        const prevCol = parseInt(selectedSquare.dataset.col);
                        const pieceSymbol = boardState[prevRow][prevCol];

                        // Update boardState
                        boardState[clickedRow][clickedCol] = pieceSymbol;
                        boardState[prevRow][prevCol] = '';

                        // Update display
                        clickedSquare.innerHTML = piecesUnicode[pieceSymbol] || '';
                        selectedSquare.innerHTML = '';

                        document.getElementById('game-status').textContent = "Piece moved."; // Generic message
                        selectedSquare.classList.remove('selected');
                        selectedSquare = null;
                    } else {
                        // Invalid move for the selected piece
                        document.getElementById('game-status').textContent = "Invalid move for this piece.";
                        // Do not deselect, allow player to choose another target
                    }
                }
            } else {
                // No square selected yet, try to select this one
                const pieceSymbol = boardState[clickedRow][clickedCol];
                if (pieceSymbol) { // Can only select squares with pieces (non-empty)
                    selectedSquare = clickedSquare;
                    selectedSquare.classList.add('selected');
                    document.getElementById('game-status').textContent = "Piece selected. Click another square to move.";
                }
            }
        }

        function getPieceColor(pieceSymbol) {
            if (!pieceSymbol) return null; // Empty square
            if (pieceSymbol === pieceSymbol.toUpperCase()) {
                return 'white';
            } else {
                return 'black';
            }
        }

        function isValidMove(sourceSqDom, targetSqDom) {
            const sRow = parseInt(sourceSqDom.dataset.row);
            const sCol = parseInt(sourceSqDom.dataset.col);
            const tRow = parseInt(targetSqDom.dataset.row);
            const tCol = parseInt(targetSqDom.dataset.col);

            const pieceSymbol = boardState[sRow][sCol];
            const pieceColor = getPieceColor(pieceSymbol);

            if (!pieceColor) return false; // Should not happen if selection logic is correct

            // Delegate to specific piece validation functions
            const pieceType = pieceSymbol.toUpperCase();
            if (pieceType === 'P') {
                return isValidPawnMove(sRow, sCol, tRow, tCol, pieceColor);
            } else if (pieceType === 'R') {
                return isValidRookMove(sRow, sCol, tRow, tCol, pieceColor);
            } else if (pieceType === 'N') {
                return isValidKnightMove(sRow, sCol, tRow, tCol, pieceColor);
            } else if (pieceType === 'B') {
                return isValidBishopMove(sRow, sCol, tRow, tCol, pieceColor);
            } else if (pieceType === 'Q') {
                return isValidQueenMove(sRow, sCol, tRow, tCol, pieceColor);
            } else if (pieceType === 'K') {
                return isValidKingMove(sRow, sCol, tRow, tCol, pieceColor);
            }
            // All standard pieces should be handled now.
            // If pieceType is unrecognized, it's an error or unexpected symbol.
            console.error(`Unrecognized piece type: ${pieceType}`);
            document.getElementById('game-status').textContent = `Unknown piece type: ${pieceType}.`;
            return false;
        }

        function isValidPawnMove(sRow, sCol, tRow, tCol, pieceColor) {
            const targetPieceSymbol = boardState[tRow][tCol];
            const targetPieceColor = getPieceColor(targetPieceSymbol);
            const statusElement = document.getElementById('game-status'); // For verbose logging

            if (pieceColor === 'white') {
                // Standard One Square Move
                if (sCol === tCol && tRow === sRow + 1 && !targetPieceSymbol) {
                    statusElement.textContent = "Valid: White pawn one square move.";
                    return true;
                }
                // Initial Two Square Move
                if (sRow === 1 && sCol === tCol && tRow === sRow + 2 && !targetPieceSymbol && !boardState[sRow + 1][sCol]) {
                    statusElement.textContent = "Valid: White pawn two square move.";
                    return true;
                }
                // Diagonal Capture
                if (tRow === sRow + 1 && (tCol === sCol + 1 || tCol === sCol - 1) && targetPieceColor === 'black') {
                    statusElement.textContent = "Valid: White pawn capture.";
                    return true;
                }
            } else if (pieceColor === 'black') {
                // Standard One Square Move
                if (sCol === tCol && tRow === sRow - 1 && !targetPieceSymbol) {
                    statusElement.textContent = "Valid: Black pawn one square move.";
                    return true;
                }
                // Initial Two Square Move
                if (sRow === 6 && sCol === tCol && tRow === sRow - 2 && !targetPieceSymbol && !boardState[sRow - 1][sCol]) {
                    statusElement.textContent = "Valid: Black pawn two square move.";
                    return true;
                }
                // Diagonal Capture
                if (tRow === sRow - 1 && (tCol === sCol + 1 || tCol === sCol - 1) && targetPieceColor === 'white') {
                    statusElement.textContent = "Valid: Black pawn capture.";
                    return true;
                }
            }
            statusElement.textContent = "Invalid pawn move."; // Default if no rule matched
            return false;
        }

        function isValidRookMove(sRow, sCol, tRow, tCol, pieceColor) {
            const statusElement = document.getElementById('game-status'); // For verbose logging
            const targetPieceSymbol = boardState[tRow][tCol];
            const targetPieceColor = getPieceColor(targetPieceSymbol);

            if (sRow !== tRow && sCol !== tCol) {
                statusElement.textContent = "Invalid Rook move: Not horizontal or vertical.";
                return false; // Rooks move horizontally or vertically
            }

            // Check path clearance
            if (sRow === tRow) { // Horizontal move
                const step = (tCol > sCol) ? 1 : -1;
                for (let c = sCol + step; c !== tCol; c += step) {
                    if (boardState[sRow][c]) {
                        statusElement.textContent = `Invalid Rook move: Path blocked at ${sRow},${c}.`;
                        return false; // Path blocked
                    }
                }
            } else { // Vertical move (sCol === tCol)
                const step = (tRow > sRow) ? 1 : -1;
                for (let r = sRow + step; r !== tRow; r += step) {
                    if (boardState[r][sCol]) {
                        statusElement.textContent = `Invalid Rook move: Path blocked at ${r},${sCol}.`;
                        return false; // Path blocked
                    }
                }
            }

            // Check target square
            if (targetPieceSymbol) {
                if (targetPieceColor === pieceColor) {
                    statusElement.textContent = "Invalid Rook move: Cannot capture same color piece.";
                    return false; // Cannot capture same color piece
                }
                statusElement.textContent = "Valid Rook capture.";
                return true; // Valid capture
            }

            statusElement.textContent = "Valid Rook move to empty square.";
            return true; // Valid move to an empty square
        }

        function isValidKnightMove(sRow, sCol, tRow, tCol, pieceColor) {
            const statusElement = document.getElementById('game-status');
            const targetPieceSymbol = boardState[tRow][tCol];
            const targetPieceColor = getPieceColor(targetPieceSymbol);

            const rowDiff = Math.abs(sRow - tRow);
            const colDiff = Math.abs(sCol - tCol);

            if (!((rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2))) {
                statusElement.textContent = "Invalid Knight move: Not an L-shape.";
                return false;
            }

            // Check target square
            if (targetPieceSymbol) {
                if (targetPieceColor === pieceColor) {
                    statusElement.textContent = "Invalid Knight move: Cannot capture same color piece.";
                    return false; // Cannot capture same color piece
                }
                statusElement.textContent = "Valid Knight capture.";
                return true; // Valid capture
            }

            statusElement.textContent = "Valid Knight move to empty square.";
            return true; // Valid move to an empty square
        }

        function isValidBishopMove(sRow, sCol, tRow, tCol, pieceColor) {
            const statusElement = document.getElementById('game-status');
            const targetPieceSymbol = boardState[tRow][tCol];
            const targetPieceColor = getPieceColor(targetPieceSymbol);

            if (Math.abs(sRow - tRow) !== Math.abs(sCol - tCol) || sRow === tRow || sCol === tCol) {
                statusElement.textContent = "Invalid Bishop move: Not diagonal.";
                return false; // Bishops move diagonally
            }

            // Path Clearance
            const dr = (tRow - sRow) / Math.abs(tRow - sRow); // Row step: -1 or 1
            const dc = (tCol - sCol) / Math.abs(tCol - sCol); // Col step: -1 or 1

            let currR = sRow + dr;
            let currC = sCol + dc;

            while (currR !== tRow || currC !== tCol) {
                if (boardState[currR][currC]) {
                    statusElement.textContent = `Invalid Bishop move: Path blocked at ${currR},${currC}.`;
                    return false; // Path blocked
                }
                currR += dr;
                currC += dc;
            }

            // Check target square
            if (targetPieceSymbol) {
                if (targetPieceColor === pieceColor) {
                    statusElement.textContent = "Invalid Bishop move: Cannot capture same color piece.";
                    return false; // Cannot capture same color piece
                }
                statusElement.textContent = "Valid Bishop capture.";
                return true; // Valid capture
            }

            statusElement.textContent = "Valid Bishop move to empty square.";
            return true; // Valid move to an empty square
        }

        function isValidQueenMove(sRow, sCol, tRow, tCol, pieceColor) {
            const statusElement = document.getElementById('game-status');
            const targetPieceSymbol = boardState[tRow][tCol];
            const targetPieceColor = getPieceColor(targetPieceSymbol);

            const isRookLike = (sRow === tRow || sCol === tCol);
            const isBishopLike = (Math.abs(sRow - tRow) === Math.abs(sCol - tCol));

            if (!isRookLike && !isBishopLike) {
                statusElement.textContent = "Invalid Queen move: Not straight or diagonal.";
                return false;
            }

            // Path Clearance
            if (isRookLike) {
                // Horizontal or Vertical Path (copied from isValidRookMove)
                if (sRow === tRow) { // Horizontal move
                    const step = (tCol > sCol) ? 1 : -1;
                    for (let c = sCol + step; c !== tCol; c += step) {
                        if (boardState[sRow][c]) {
                            statusElement.textContent = `Invalid Queen move: Path blocked at ${sRow},${c}.`;
                            return false;
                        }
                    }
                } else { // Vertical move
                    const step = (tRow > sRow) ? 1 : -1;
                    for (let r = sRow + step; r !== tRow; r += step) {
                        if (boardState[r][sCol]) {
                            statusElement.textContent = `Invalid Queen move: Path blocked at ${r},${sCol}.`;
                            return false;
                        }
                    }
                }
            } else if (isBishopLike) {
                // Diagonal Path (copied from isValidBishopMove)
                const dr = (tRow - sRow) / Math.abs(tRow - sRow);
                const dc = (tCol - sCol) / Math.abs(tCol - sCol);
                let currR = sRow + dr;
                let currC = sCol + dc;
                while (currR !== tRow || currC !== tCol) {
                    if (boardState[currR][currC]) {
                        statusElement.textContent = `Invalid Queen move: Path blocked at ${currR},${currC}.`;
                        return false;
                    }
                    currR += dr;
                    currC += dc;
                }
            }

            // Check target square
            if (targetPieceSymbol) {
                if (targetPieceColor === pieceColor) {
                    statusElement.textContent = "Invalid Queen move: Cannot capture same color piece.";
                    return false;
                }
                statusElement.textContent = "Valid Queen capture.";
                return true;
            }

            statusElement.textContent = "Valid Queen move to empty square.";
            return true;
        }

        function isValidKingMove(sRow, sCol, tRow, tCol, pieceColor) {
            const statusElement = document.getElementById('game-status');
            const targetPieceSymbol = boardState[tRow][tCol];
            const targetPieceColor = getPieceColor(targetPieceSymbol);

            const rowDiff = Math.abs(sRow - tRow);
            const colDiff = Math.abs(sCol - tCol);

            // King moves one square in any direction
            if (rowDiff > 1 || colDiff > 1 || (rowDiff === 0 && colDiff === 0)) {
                statusElement.textContent = "Invalid King move: Must move one square.";
                return false;
            }

            // Target Square (No Path Clearance needed for a single step)
            if (targetPieceSymbol) {
                if (targetPieceColor === pieceColor) {
                    statusElement.textContent = "Invalid King move: Cannot capture same color piece.";
                    return false; // Cannot capture same color piece
                }
                statusElement.textContent = "Valid King capture.";
                return true; // Valid capture
            }

            statusElement.textContent = "Valid King move to empty square.";
            return true; // Valid move to an empty square
        }

        document.addEventListener('DOMContentLoaded', setupChessboard);
    </script>
</body>
</html>
